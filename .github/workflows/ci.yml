# Continuous Integration pipeline.

# Runs on every push to main and every pull request targeting main.
# Three jobs in sequence: lint and test → build and push image → deploy to HF Spaces.

# The build and deploy jobs only run on pushes to main (not on PRs) because
# we do not want every open PR to publish a new image to the registry.

# Prerequisites (GitHub secrets to configure):
#   HF_TOKEN

# Container registry: ghcr.io (GitHub's own registry, free for public repos).
# Deployment target:  HuggingFace Spaces
name: CI

on:
  # will trigger on push or pull
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # ghcr.io (github container regsitry) is where docker image is stored
  REGISTRY: ghcr.io
  # github.repository is "username/repo-name" which is what ghcr.io expects.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Lint and Test
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      # download code over ubuntu
      - name: Check out the code
        uses: actions/checkout@v6

      # uv and Python
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Create virtual environment
        run: uv venv

      # install dependencies
      - name: Install development dependencies
        run: uv sync

      # linting is checking the code for problem before running
      # ruff is a extremly fast python linter
      - name: Lint with ruff
      # check scans for code problems
      # format verifies the code is formatted correctly (indentation, spacing, line length)
      # they dont change any files, they only report problems, if issue present exit with code 1
      # AGAIN NO CODE CHANGE HERE, IT JUST CHECKS
        run: |
          uv run ruff check app/ scripts/ tests/ 
          uv run ruff format --check app/ scripts/ tests/

      - name: Run tests
        # MODEL_NAME is set so the predict module knows which pipeline to (mock) load.
        env:
          MODEL_NAME: distilbert-base-uncased-finetuned-sst-2-english
        run: uv run pytest tests/ -v --tb=short 
        # runs all the files in tests/ folder
        # pytest is python's testing framework
        # -v — verbose. Show each test name as it runs.
        # --tb=short — if a test fails, show a short version of the error. Not the full 50-line traceback.


  # Job 2: Build and Push Docker Image
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    # wont run till Job1, so we dont push a broken docker image
    needs: lint-and-test

    # Only publish images on pushes to main, not on PRs.
    # PRs gets skip the job entirely! ONly merged code gets a Docker image built
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      # thsi for for reading the repo code
      contents: read 
      # this is for the Docker image pushing to ghcr.io
      packages: write

    steps:
      # downloading the files to Ubuntu runner
      - name: Check out the code
        uses: actions/checkout@v6

      # Logs Docker into ghcr.io, like runningn docker login ghcr.io in your terminal
      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }} #ghcr.io (ghcr.io is GitHub Container Registry)
          username: ${{ github.actor }} #github username
          # GITHUB_TOKEN is automatically available — no separate secret needed.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 2 tags generated one points tro exact commit that build it, other to the newest
          # these are for generating 2 images 
          # in case a pred goes wrong we know which to solve
          # latest for deploying and teh exact for debugging
          tags: |
            type=sha,prefix=sha- 
            type=raw,value=latest

      # extened Docker build engine as the next step uses advance features like GItHub Actions layer cahching
      # regualr docker build doesnt support cache flags
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v5
        with:
          context: . # use the current folder as the Docker build contexct
          push: true # push to ghcr.io, if False would locally build and discard
          tags: ${{ steps.meta.outputs.tags }} # the 2 tags
          # Bake the git SHA into the image so /predict can return it.
          build-args: GIT_SHA=${{ github.sha }}
          # GitHub Actions cache avoids re-downloading PyTorch and HuggingFace
          # weights on every build. This alone cuts build time from ~15 min to ~3 min.
          cache-from: type=gha # pulling the cache layers from GHA cache
          cache-to: type=gha,mode=max # save the new layers back to cache for next run


  # Job 3: Deploy to HuggingFace Spaces
  deploy:
    name: Deploy to HuggingFace Spaces
    runs-on: ubuntu-latest
    needs: build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install HuggingFace Hub client
        run: uv pip install huggingface_hub==0.24.0

      - name: Upload repository to HuggingFace Spaces
        # This pushes the whole repo to the Space, which triggers a rebuild
        # and redeploy on HuggingFace's infrastructure. The Dockerfile is
        # what HF uses to build and run the app.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          import sys
          from huggingface_hub import HfApi
          from huggingface_hub.utils import HfHubHTTPError

          api = HfApi(token=os.environ["HF_TOKEN"])

          try:
              api.whoami()
              api.upload_folder(
                  folder_path=".",
                  repo_id="sahil147/sentiment-api",
                  repo_type="space",
                  ignore_patterns=[
                      ".git",
                      ".github",
                      "__pycache__",
                      "*.pyc",
                      "logs/",
                      "model/",
                      ".env",
                      "*.egg-info",
                  ],
              )
          except HfHubHTTPError as exc:
              if exc.response is not None and exc.response.status_code == 403:
                  sys.exit(
                      "Hugging Face deploy failed: HF_TOKEN must be a write-scoped token "
                      "with permission to update sahil147/sentiment-api. "
                      "Regenerate the token with role=write and replace the GitHub secret."
                  )
              raise

          print("Deployment to HuggingFace Spaces complete.")
          EOF
# 403 issue means token doesnt have the permission