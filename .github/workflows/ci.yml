# Continuous Integration pipeline.

# Runs on every push to main and every pull request targeting main.
# Three jobs in sequence: lint and test → build and push image → deploy to HF Spaces.

# The build and deploy jobs only run on pushes to main (not on PRs) because
# we do not want every open PR to publish a new image to the registry.

# Prerequisites (GitHub secrets to configure):
#   HF_TOKEN

# Container registry: ghcr.io (GitHub's own registry, free for public repos).
# Deployment target:  HuggingFace Spaces
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # github.repository is "username/repo-name" which is what ghcr.io expects.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Lint and Test
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check app/ scripts/ tests/
          ruff format --check app/ scripts/ tests/

      - name: Run tests
        # MODEL_NAME is set so the predict module knows which pipeline to (mock) load.
        env:
          MODEL_NAME: distilbert-base-uncased-finetuned-sst-2-english
        run: pytest tests/ -v --tb=short


  # Job 2: Build and Push Docker Image
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: lint-and-test

    # Only publish images on pushes to main, not on PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN is automatically available — no separate secret needed.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Bake the git SHA into the image so /predict can return it.
          build-args: GIT_SHA=${{ github.sha }}
          # GitHub Actions cache avoids re-downloading PyTorch and HuggingFace
          # weights on every build. This alone cuts build time from ~15 min to ~3 min.
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # Job 3: Deploy to HuggingFace Spaces
  deploy:
    name: Deploy to HuggingFace Spaces
    runs-on: ubuntu-latest
    needs: build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python for the HF Hub client
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install HuggingFace Hub client
        run: pip install huggingface_hub==0.23.0

      - name: Upload repository to HuggingFace Spaces
        # This pushes the whole repo to the Space, which triggers a rebuild
        # and redeploy on HuggingFace's infrastructure. The Dockerfile is
        # what HF uses to build and run the app.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])

          # TODO: replace YOUR_HF_USERNAME with your actual HuggingFace username.
          api.upload_folder(
              folder_path=".",
              repo_id="sahil147/sentiment-api",
              repo_type="space",
              ignore_patterns=[
                  ".git",
                  ".github",
                  "__pycache__",
                  "*.pyc",
                  "logs/",
                  "model/",
                  ".env",
                  "*.egg-info",
              ],
          )

          print("Deployment to HuggingFace Spaces complete.")
          EOF
